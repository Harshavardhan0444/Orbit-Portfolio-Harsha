<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#040714" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Outer Orbit Ellipse -->
  <ellipse cx="50" cy="50" rx="38" ry="16" transform="rotate(-30 50 50)" stroke="url(#orbGrad)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.85" filter="url(#glow)"/>
  
  <!-- Secondary Orbit -->
  <ellipse cx="50" cy="50" rx="36" ry="14" transform="rotate(45 50 50)" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Core Nucleus -->
  <circle cx="50" cy="50" r="14" fill="url(#orbGrad)" filter="url(#glow)"/>
  <circle cx="46" cy="46" r="4" fill="#ffffff" opacity="0.8"/>

  <!-- Orbiting Node -->
  <circle cx="78" cy="34" r="4" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="24" cy="68" r="3" fill="#a855f7" filter="url(#glow)"/>
</svg>
